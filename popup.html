<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>MeetScribe</h1>
    <p class="subtitle">AI議事録</p>

    <div id="status" class="status idle">待機中</div>
    <div id="timer" class="timer">00:00:00</div>

    <button id="btn-record" class="btn btn-start">録音開始</button>

    <div class="footer">
      <a href="#" id="link-results">前回の結果を見る</a>
      <a href="#" id="link-settings">設定</a>
    </div>

    <!-- 同意確認モーダル -->
    <div id="consent-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-icon">&#9888;</div>
        <h2>録音前の確認</h2>
        <p class="modal-desc">この録音は会議タブの音声をキャプチャします。<br>参加者のプライバシーを尊重し、<strong>必ず事前に録音の同意を得てください。</strong></p>
        <label class="consent-check">
          <input type="checkbox" id="consent-checkbox">
          <span>参加者に録音することを伝えました</span>
        </label>
        <div class="modal-buttons">
          <button id="btn-consent-cancel" class="btn btn-small">キャンセル</button>
          <button id="btn-consent-ok" class="btn btn-consent-start" disabled>録音開始</button>
        </div>
      </div>
    </div>

    <!-- 設定パネル（トグル表示） -->
    <div id="settings-panel" class="settings-panel hidden">
      <h2>設定</h2>
      <label>
        Gemini API Key（MeetScribe用）
        <input type="password" id="input-api-key" placeholder="AIza...">
      </label>
      <label>
        出力言語
        <select id="select-language">
          <option value="ja" selected>日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="btn-save-settings" class="btn btn-small">保存</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
